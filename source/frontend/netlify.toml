# Netlify config — Frontend (base: source/frontend)
# Di Netlify, set "Base directory" = source/frontend (atau deploy dari folder ini).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — semua route ke index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_API_BASE_URL di Netlify UI (Environment variables) ke URL backend Render, mis:
#   VITE_API_BASE_URL = https://feri-site-api.onrender.com
[build.environment]
  NODE_VERSION = "20"
